{% extends "base.html" %}

{% block title %}Register | Intelligent Data Privacy Management System{% endblock %}

{% block content %}
  <h1>Create an account</h1>
  <form method="post">
    <p>
      <label for="full_name">Full name</label><br>
      <input id="full_name" name="full_name" type="text" maxlength="100" required>
    </p>
    <p>
      <label for="email">Email address</label><br>
      <input id="email" name="email" type="email" maxlength="255" required>
    </p>
    <p>
      <label for="password">Password</label><br>
      <input id="password" name="password" type="password" minlength="8" required>
    </p>
    <button type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
{% endblock %}
